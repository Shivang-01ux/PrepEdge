# ─── Server ───────────────────────────────────────────────
server.port=${PORT:8080}
# Tomcat thread pool for handling concurrent exam traffic
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100
server.tomcat.connection-timeout=20000

# ─── Database (Supabase Session Pooler - IPv4 compatible) ─
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DATABASE_USERNAME:postgres.cmhkksggfpvcikfiniiu}
spring.datasource.password=${DATABASE_PASSWORD:Stakurprepedge}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── HikariCP Connection Pool ─────────────────────────────
# Supabase free tier allows max 60 connections — stay well below
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.leak-detection-threshold=60000

# ─── JPA / Hibernate ──────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
# Disable SQL logging in prod (saves memory + reduces noise)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Batch inserts for seeder performance
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ─── JWT ──────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:prepedge-super-secret-key-change-in-production-256bits}
jwt.expiration=86400000

# ─── Logging (INFO in prod — saves memory) ───────────────
logging.level.org.springframework.security=WARN
logging.level.com.prepedge=INFO
logging.level.org.hibernate=WARN

# ─── Async thread pool (for email sending) ────────────────
spring.task.execution.pool.core-size=3
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=50

# ─── Mail (Brevo HTTP API) ────────────────────────────────
brevo.api.key=${BREVO_API_KEY:}
spring.mail.username=${MAIL_USERNAME:noreply.prepedge@gmail.com}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration